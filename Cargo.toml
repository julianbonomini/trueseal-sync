[package]
name = "trueseal-sync"
version = "0.6.0"
edition = "2021"
description = "E2EE sync engine built on trueseal-noise"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
thiserror = "1"
log = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
base64 = "0.22"
prost = "0.13"
tokio = { version = "1", features = [
  "net",
  "rt-multi-thread",
  "macros",
  "sync",
  "io-util",
] }
# Pinned to the NOISE-1 merge commit (caller-supplied prologue in XX and NK, noise#25/#33).
# Exact rev per ADR-0030 / gate G8 — no floating tags for cross-repo inputs.
trueseal-noise = { git = "https://github.com/julianbonomini/trueseal-noise", rev = "6cea366a741e618709503f0a41c4f58d5973c381" }
uniffi = { version = "0.28", features = ["tokio", "cli"] }
# UniFFI async callback interfaces (the awaited message handler, ADR-0028)
# expand to async_trait-generated traits + ForeignFuture, driven here with
# futures::executor::block_on from the receive thread.
async-trait = "0.1"
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }

# iOS/macOS backup exclusion (SYNC-14): the NSURLIsExcludedFromBackupKey
# resource value is persisted as a filesystem xattr; writing it directly
# keeps the core free of an Objective-C dependency.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
prost-build = "0.13"
protox = "0.7"
uniffi = { version = "0.28", features = ["build"] }
