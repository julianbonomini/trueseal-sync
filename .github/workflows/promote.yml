name: Promote

# e2e ADR-0002: promotion publishes the EXACT bytes the candidate staged and
# the gate tested — the same draft, published. The tag is pushed only here.
# Idempotent: a re-run on an already-published release is a no-op success.
# The Release Conductor calls this after a green gate; a maintainer can too:
#   gh workflow run promote.yml -f version=0.6.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Lockstep version to promote, e.g. 0.6.0 (no leading v)"
        required: true
        type: string

concurrency:
  group: promote-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    name: verify staged bytes + publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate the version input
        run: |
          echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "FAIL: version must be X.Y.Z without a leading v"; exit 1; }

      - name: Resolve the staged release
        id: staged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          if ! gh release view "$TAG" --json isDraft,targetCommitish > /tmp/staged.json 2>/dev/null; then
            echo "FAIL: no release $TAG — run candidate.yml for ${{ inputs.version }} first" >&2
            exit 1
          fi
          IS_DRAFT=$(jq -r .isDraft /tmp/staged.json)
          TARGET=$(jq -r .targetCommitish /tmp/staged.json)
          echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "staged: draft=$IS_DRAFT commit=$TARGET"

      # e2e ADR-0002: "a failed promotion is retried forward ... a re-run
      # publishes only missing channels." If this channel is already live,
      # there is nothing to do.
      - name: Already published — idempotent no-op
        if: steps.staged.outputs.is_draft == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "v${{ inputs.version }} is already published; nothing to do"

      - name: Checkout the candidate commit
        if: steps.staged.outputs.is_draft == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.staged.outputs.target }}

      # G9 hard gate on the bytes being promoted: versions match, the
      # changelog entry exists with all SDK subsections + the Breaking heading.
      - name: Pre-promotion metadata checks (G9)
        if: steps.staged.outputs.is_draft == 'true'
        run: |
          bash scripts/check-cargo-version.sh "${{ inputs.version }}"
          bash scripts/check-changelog-entry.sh "${{ inputs.version }}"

      - name: Download the staged assets
        if: steps.staged.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/staged-assets
          gh release download "v${{ inputs.version }}" --dir /tmp/staged-assets --clobber
          ls -la /tmp/staged-assets

      - name: Verify the expected asset set
        if: steps.staged.outputs.is_draft == 'true'
        run: |
          V="v${{ inputs.version }}"
          D=/tmp/staged-assets
          for F in \
            "trueseal-sync-swift-$V.zip" "trueseal-sync-swift-$V.zip.sha256" \
            "trueseal-sync-android-$V.zip" "trueseal-sync-android-$V.zip.sha256" \
            "trueseal-sync-linux-x64-$V.zip" "trueseal-sync-linux-x64-$V.zip.sha256" \
            "shared-facts.json" "api-surface.json"; do
            [ -f "$D/$F" ] || { echo "FAIL: staged asset missing: $F" >&2; exit 1; }
          done
          echo "OK: all 8 expected assets present"

      # The gate tested THESE bytes; publish only if they are still these bytes.
      - name: Verify every checksum
        if: steps.staged.outputs.is_draft == 'true'
        run: |
          cd /tmp/staged-assets
          for SUM in *.sha256; do
            echo "▶ $SUM"
            shasum -a 256 --check "$SUM"
          done

      # The changelog section becomes the release notes (e2e ADR-0002: the
      # one lockstep changelog, linked from every release in the group).
      - name: Publish the staged bytes (pushes the tag)
        if: steps.staged.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v$VERSION"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {found=1; next} /^## / {found=0} found' CHANGELOG.md \
            > /tmp/release-notes.md
          [ -s /tmp/release-notes.md ] || { echo "FAIL: empty changelog section for $VERSION" >&2; exit 1; }
          gh release edit "$TAG" \
            --title "TrueSeal $VERSION" \
            --notes-file /tmp/release-notes.md \
            --draft=false
          echo "published $TAG"

      - name: Confirm the tag is live
        if: steps.staged.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          git ls-remote --tags origin "$TAG" | grep -q "$TAG" \
            || { echo "FAIL: tag $TAG not on origin after publish" >&2; exit 1; }
          gh release view "$TAG" --json isDraft --jq .isDraft | grep -q false \
            || { echo "FAIL: release still a draft after publish" >&2; exit 1; }
          echo "OK: $TAG published, tag on origin at ${{ steps.staged.outputs.target }}"
