name: Candidate

# e2e ADR-0002: candidates are built FROM A COMMIT, never a tag, and staged
# in a DRAFT GitHub Release. No tag is pushed here — promotion is a separate
# dispatch (promote.yml). The Release Conductor (trueseal-e2e) starts this
# with the commit and target version; a maintainer can do the same by hand:
#   gh workflow run candidate.yml -f commit=<sha> -f version=0.6.0

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full commit SHA to build the candidate from"
        required: true
        type: string
      version:
        description: "Target lockstep version, e.g. 0.6.0 (no leading v)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CRATE_NAME: trueseal_sync

concurrency:
  group: candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: validate metadata + create the draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate the version input
        run: |
          echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "FAIL: version must be X.Y.Z without a leading v"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # G9, failing early: the bytes about to be built must carry the target
      # version and the changelog must already have the entry.
      - name: Cargo version matches the target (ADR-0030)
        run: bash scripts/check-cargo-version.sh "${{ inputs.version }}"

      - name: Changelog entry exists (e2e ADR-0002)
        run: bash scripts/check-changelog-entry.sh "${{ inputs.version }}"

      # Idempotent candidate rebuilds: a re-run replaces the draft for the
      # same version. Only drafts are deleted — a published release is never
      # touched here.
      - name: Replace any existing draft for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release delete "$TAG" --yes
            echo "replaced existing draft $TAG"
          else
            echo "no existing draft for $TAG"
          fi

      - name: Create the empty draft release at the candidate commit
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ inputs.commit }}
          name: "TrueSeal ${{ inputs.version }} (candidate)"
          body: |
            Candidate artifacts for the gated TrueSeal Release `${{ inputs.version }}`,
            built from commit `${{ inputs.commit }}` (e2e ADR-0002). Promote with
            `promote.yml`; a red gate deletes this draft and burns nothing.
          draft: true
          prerelease: false

  swift:
    name: build swift candidate (xcframework + bindings)
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: /tmp/trueseal-sync-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-apple-darwin
            x86_64-apple-darwin
            aarch64-apple-ios
            aarch64-apple-ios-sim
            x86_64-apple-ios

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/trueseal-sync-build
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cross-compile for all Apple targets
        run: |
          for TARGET in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios; do
            echo "▶ cargo build --release --target $TARGET"
            cargo build --release --target "$TARGET"
          done

      - name: Lipo universal slices
        run: |
          LIB="lib${CRATE_NAME}.a"
          B="$CARGO_TARGET_DIR"
          OUT="/tmp/trueseal-xcframework-slices"
          mkdir -p "$OUT/macos" "$OUT/ios" "$OUT/ios-sim"

          lipo -create \
            "$B/aarch64-apple-darwin/release/$LIB" \
            "$B/x86_64-apple-darwin/release/$LIB" \
            -output "$OUT/macos/$LIB"

          cp "$B/aarch64-apple-ios/release/$LIB" "$OUT/ios/$LIB"

          lipo -create \
            "$B/aarch64-apple-ios-sim/release/$LIB" \
            "$B/x86_64-apple-ios/release/$LIB" \
            -output "$OUT/ios-sim/$LIB"

      - name: Generate UniFFI Swift bindings
        run: |
          BINDGEN_OUT="/tmp/trueseal-xcframework-slices/bindings"
          mkdir -p "$BINDGEN_OUT"
          cargo run --release --bin uniffi-bindgen -- generate \
            --library "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/lib${CRATE_NAME}.a" \
            --language swift \
            --out-dir "$BINDGEN_OUT"

      - name: Copy headers to slices
        run: |
          BINDGEN_OUT="/tmp/trueseal-xcframework-slices/bindings"
          for SLICE in macos ios ios-sim; do
            mkdir -p "/tmp/trueseal-xcframework-slices/$SLICE/include"
            cp "$BINDGEN_OUT/${CRATE_NAME}FFI.h"         "/tmp/trueseal-xcframework-slices/$SLICE/include/"
            cp "$BINDGEN_OUT/${CRATE_NAME}FFI.modulemap" "/tmp/trueseal-xcframework-slices/$SLICE/include/module.modulemap"
          done

      - name: Assemble TruesealSyncFFI.xcframework
        run: |
          OUT="/tmp/trueseal-xcframework-slices"
          LIB="lib${CRATE_NAME}.a"
          XCFW="/tmp/TruesealSyncFFI.xcframework"
          rm -rf "$XCFW"
          xcodebuild -create-xcframework \
            -library "$OUT/macos/$LIB"    -headers "$OUT/macos/include"    \
            -library "$OUT/ios/$LIB"      -headers "$OUT/ios/include"      \
            -library "$OUT/ios-sim/$LIB"  -headers "$OUT/ios-sim/include"  \
            -output "$XCFW"

      - name: Package zip + checksum
        run: |
          VERSION="v${{ inputs.version }}"
          ZIPNAME="trueseal-sync-swift-${VERSION}.zip"
          XCFW="/tmp/TruesealSyncFFI.xcframework"
          BINDINGS="/tmp/trueseal-xcframework-slices/bindings/${CRATE_NAME}.swift"

          STAGING="/tmp/trueseal-swift-staging"
          mkdir -p "$STAGING"
          cp -R "$XCFW" "$STAGING/"
          cp "$BINDINGS" "$STAGING/${CRATE_NAME}.swift"

          cd /tmp
          zip -r "$ZIPNAME" "trueseal-swift-staging"
          shasum -a 256 "$ZIPNAME" > "${ZIPNAME}.sha256"

          echo "ZIP=/tmp/$ZIPNAME" >> "$GITHUB_ENV"
          echo "SHA256=/tmp/${ZIPNAME}.sha256" >> "$GITHUB_ENV"

      - name: Stage in the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          draft: true
          files: |
            ${{ env.ZIP }}
            ${{ env.SHA256 }}

  android:
    name: build android candidate (.so + kotlin bindings)
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: /tmp/trueseal-android-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Install Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android
            x86_64-linux-android

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/trueseal-android-build
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cross-compile for Android targets
        env:
          # 16KB-page-size alignment — required by Android 15+ devices and
          # Play Store uploads from Nov 2025. Without this, dlopen fails:
          # "program alignment (8192) cannot be smaller than system page size (16384)".
          # Scoped per-target so the later host `cargo build` (for uniffi-bindgen)
          # is not affected.
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
          CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          for TARGET in aarch64-linux-android x86_64-linux-android; do
            echo "▶ cargo ndk --target $TARGET -- build --release"
            cargo ndk --target "$TARGET" -- build --release
          done

      - name: Verify 16KB page alignment
        run: |
          NDK_LLVM_READELF=$(find "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)
          for ABI_TRIPLE in aarch64-linux-android x86_64-linux-android; do
            SO="$CARGO_TARGET_DIR/$ABI_TRIPLE/release/lib${CRATE_NAME}.so"
            ALIGN=$("$NDK_LLVM_READELF" -lW "$SO" | awk '/LOAD/ {print $NF; exit}')
            echo "$ABI_TRIPLE LOAD align = $ALIGN"
            [ "$ALIGN" = "0x4000" ] || { echo "FAIL: expected 0x4000 (16384), got $ALIGN"; exit 1; }
          done

      - name: Build host library for UniFFI bindgen
        run: cargo build --release

      - name: Generate UniFFI Kotlin bindings
        run: |
          BINDGEN_OUT="/tmp/trueseal-kotlin-bindings"
          mkdir -p "$BINDGEN_OUT"
          cargo run --release --bin uniffi-bindgen -- generate \
            --library "$CARGO_TARGET_DIR/release/lib${CRATE_NAME}.so" \
            --language kotlin \
            --out-dir "$BINDGEN_OUT"

      - name: Package zip + checksum
        run: |
          VERSION="v${{ inputs.version }}"
          ZIPNAME="trueseal-sync-android-${VERSION}.zip"
          STAGING="/tmp/trueseal-android-staging"

          mkdir -p \
            "$STAGING/jniLibs/arm64-v8a" \
            "$STAGING/jniLibs/x86_64" \
            "$STAGING/kotlin/uniffi/trueseal_sync" \
            "$STAGING/kotlin/uniffi/trueseal_noise"

          cp "$CARGO_TARGET_DIR/aarch64-linux-android/release/lib${CRATE_NAME}.so" \
             "$STAGING/jniLibs/arm64-v8a/"
          cp "$CARGO_TARGET_DIR/x86_64-linux-android/release/lib${CRATE_NAME}.so" \
             "$STAGING/jniLibs/x86_64/"

          cp "/tmp/trueseal-kotlin-bindings/uniffi/trueseal_sync/trueseal_sync.kt" \
             "$STAGING/kotlin/uniffi/trueseal_sync/"
          cp "/tmp/trueseal-kotlin-bindings/uniffi/trueseal_noise/trueseal_noise.kt" \
             "$STAGING/kotlin/uniffi/trueseal_noise/"

          cd /tmp
          zip -r "$ZIPNAME" "trueseal-android-staging"
          shasum -a 256 "$ZIPNAME" > "${ZIPNAME}.sha256"

          echo "ANDROID_ZIP=/tmp/$ZIPNAME" >> "$GITHUB_ENV"
          echo "ANDROID_SHA256=/tmp/${ZIPNAME}.sha256" >> "$GITHUB_ENV"

      - name: Stage in the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          draft: true
          files: |
            ${{ env.ANDROID_ZIP }}
            ${{ env.ANDROID_SHA256 }}

  # Linux x64 (glibc) core library (SYNC-22). A TEST INPUT ONLY: the Kotlin
  # repo's headless e2e lane (e2e ADR-0001) runs a test-only JVM build against
  # this .so — it is never published as a Kotlin artifact, and plain JVM stays
  # an unsupported target for the preview.
  linux-x64:
    name: build linux-x64 core library candidate
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: /tmp/trueseal-linux-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/trueseal-linux-build
          key: ${{ runner.os }}-cargo-linux-x64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-linux-x64-

      - name: Build the cdylib
        run: cargo build --release

      - name: Verify the library loads and exports the UniFFI surface
        run: |
          SO="$CARGO_TARGET_DIR/release/lib${CRATE_NAME}.so"
          file "$SO" | grep -q "ELF 64-bit LSB shared object, x86-64" \
            || { echo "FAIL: not an x86-64 ELF shared object"; file "$SO"; exit 1; }
          COUNT=$(nm -D --defined-only "$SO" | grep -c " T uniffi_${CRATE_NAME}_fn_")
          echo "exported uniffi_${CRATE_NAME}_fn_* symbols: $COUNT"
          [ "$COUNT" -gt 0 ] || { echo "FAIL: no UniFFI symbols exported"; exit 1; }
          python3 -c "import ctypes; ctypes.CDLL('$SO'); print('dlopen ok')"

      - name: Package zip + checksum
        run: |
          VERSION="v${{ inputs.version }}"
          ZIPNAME="trueseal-sync-linux-x64-${VERSION}.zip"
          cd "$CARGO_TARGET_DIR/release"
          zip -j "/tmp/$ZIPNAME" "lib${CRATE_NAME}.so"
          cd /tmp
          shasum -a 256 "$ZIPNAME" > "${ZIPNAME}.sha256"

          echo "LINUX_ZIP=/tmp/$ZIPNAME" >> "$GITHUB_ENV"
          echo "LINUX_SHA256=/tmp/${ZIPNAME}.sha256" >> "$GITHUB_ENV"

      - name: Stage in the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          draft: true
          files: |
            ${{ env.LINUX_ZIP }}
            ${{ env.LINUX_SHA256 }}

  shared-facts:
    name: generate + stage Shared Facts (SYNC-21)
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Docs and SDKs pin the generated files per release (ADR-0030).
      # Generated fresh from the candidate commit.
      - name: Generate Shared Facts + API surface
        run: cargo run --release --bin gen-shared-facts -- --out /tmp/shared-facts

      - name: Stage in the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          draft: true
          files: |
            /tmp/shared-facts/shared-facts.json
            /tmp/shared-facts/api-surface.json
