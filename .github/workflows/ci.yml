name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: fmt / clippy / test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Authenticate private deps
        run: |
          git config --global url."https://x-access-token:${{ secrets.TRUESEAL_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      - name: connection-factory guard (SYNC-17)
        run: bash scripts/check-connection-factory.sh

      - name: shared-facts drift gate (SYNC-21)
        run: cargo run --bin gen-shared-facts -- --check

      # SYNC-22: the release workflow ships a Linux x64 cdylib for the Kotlin
      # JVM test lane (e2e ADR-0001). This runner IS x86_64-unknown-linux-gnu
      # (glibc), so building + smoke-checking here proves every PR keeps the
      # release artifact buildable and loadable.
      - name: Build the Linux x64 core library (SYNC-22)
        run: cargo build --release

      - name: Smoke — loads and exports the UniFFI surface
        run: |
          SO="target/release/libtrueseal_sync.so"
          file "$SO" | grep -q "ELF 64-bit LSB shared object, x86-64" \
            || { echo "FAIL: not an x86-64 ELF shared object"; file "$SO"; exit 1; }
          COUNT=$(nm -D --defined-only "$SO" | grep -c " T uniffi_trueseal_sync_fn_")
          echo "exported uniffi_trueseal_sync_fn_* symbols: $COUNT"
          [ "$COUNT" -gt 0 ] || { echo "FAIL: no UniFFI symbols exported"; exit 1; }
          python3 -c "import ctypes; ctypes.CDLL('$SO'); print('dlopen ok')"
