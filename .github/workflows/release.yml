name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CRATE_NAME: trueseal_sync
  CARGO_TARGET_DIR: /tmp/trueseal-sync-build

jobs:
  release:
    name: validate + build xcframework + publish
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: >-
            aarch64-apple-darwin
            x86_64-apple-darwin
            aarch64-apple-ios
            aarch64-apple-ios-sim
            x86_64-apple-ios

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/trueseal-sync-build
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Authenticate private deps
        run: |
          git config --global url."https://x-access-token:${{ secrets.TRUESEAL_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      # ── xcframework build ───────────────────────────────────────────────────

      - name: Cross-compile for all Apple targets
        run: |
          for TARGET in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios; do
            echo "▶ cargo build --release --target $TARGET"
            cargo build --release --target "$TARGET"
          done

      - name: Lipo universal slices
        run: |
          LIB="lib${CRATE_NAME}.a"
          B="$CARGO_TARGET_DIR"
          OUT="/tmp/trueseal-xcframework-slices"
          mkdir -p "$OUT/macos" "$OUT/ios" "$OUT/ios-sim"

          # macOS universal
          lipo -create \
            "$B/aarch64-apple-darwin/release/$LIB" \
            "$B/x86_64-apple-darwin/release/$LIB" \
            -output "$OUT/macos/$LIB"

          # iOS device (arm64 only)
          cp "$B/aarch64-apple-ios/release/$LIB" "$OUT/ios/$LIB"

          # iOS Simulator universal
          lipo -create \
            "$B/aarch64-apple-ios-sim/release/$LIB" \
            "$B/x86_64-apple-ios/release/$LIB" \
            -output "$OUT/ios-sim/$LIB"

      - name: Generate UniFFI Swift bindings
        run: |
          BINDGEN_OUT="/tmp/trueseal-xcframework-slices/bindings"
          mkdir -p "$BINDGEN_OUT"
          cargo run --release --bin uniffi-bindgen -- generate \
            --library "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/lib${CRATE_NAME}.a" \
            --language swift \
            --out-dir "$BINDGEN_OUT"

      - name: Copy headers to slices
        run: |
          BINDGEN_OUT="/tmp/trueseal-xcframework-slices/bindings"
          for SLICE in macos ios ios-sim; do
            mkdir -p "/tmp/trueseal-xcframework-slices/$SLICE/include"
            cp "$BINDGEN_OUT/${CRATE_NAME}FFI.h"         "/tmp/trueseal-xcframework-slices/$SLICE/include/"
            cp "$BINDGEN_OUT/${CRATE_NAME}FFI.modulemap" "/tmp/trueseal-xcframework-slices/$SLICE/include/module.modulemap"
          done

      - name: Assemble TruesealSyncFFI.xcframework
        run: |
          OUT="/tmp/trueseal-xcframework-slices"
          LIB="lib${CRATE_NAME}.a"
          XCFW="/tmp/TruesealSyncFFI.xcframework"
          rm -rf "$XCFW"
          xcodebuild -create-xcframework \
            -library "$OUT/macos/$LIB"    -headers "$OUT/macos/include"    \
            -library "$OUT/ios/$LIB"      -headers "$OUT/ios/include"      \
            -library "$OUT/ios-sim/$LIB"  -headers "$OUT/ios-sim/include"  \
            -output "$XCFW"

      - name: Package zip + checksum
        run: |
          VERSION="${{ github.ref_name }}"
          ZIPNAME="trueseal-sync-swift-${VERSION}.zip"
          XCFW="/tmp/TruesealSyncFFI.xcframework"
          BINDINGS="/tmp/trueseal-xcframework-slices/bindings/${CRATE_NAME}.swift"

          STAGING="/tmp/trueseal-swift-staging"
          mkdir -p "$STAGING"
          cp -R "$XCFW" "$STAGING/"
          cp "$BINDINGS" "$STAGING/${CRATE_NAME}.swift"

          cd /tmp
          zip -r "$ZIPNAME" "trueseal-swift-staging"
          shasum -a 256 "$ZIPNAME" > "${ZIPNAME}.sha256"

          echo "ZIP=/tmp/$ZIPNAME" >> "$GITHUB_ENV"
          echo "SHA256=/tmp/${ZIPNAME}.sha256" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.ZIP }}
            ${{ env.SHA256 }}

  release-android:
    name: build android + upload
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      CARGO_TARGET_DIR: /tmp/trueseal-android-build

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android
            x86_64-linux-android

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/trueseal-android-build
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Authenticate private deps
        run: |
          git config --global url."https://x-access-token:${{ secrets.TRUESEAL_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Cross-compile for Android targets
        env:
          # 16KB-page-size alignment — required by Android 15+ devices and
          # Play Store uploads from Nov 2025. Without this, dlopen fails:
          # "program alignment (8192) cannot be smaller than system page size (16384)".
          # Scoped per-target so the later host `cargo build` (for uniffi-bindgen)
          # is not affected.
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
          CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          for TARGET in aarch64-linux-android x86_64-linux-android; do
            echo "▶ cargo ndk --target $TARGET -- build --release"
            cargo ndk --target "$TARGET" -- build --release
          done

      - name: Verify 16KB page alignment
        run: |
          NDK_LLVM_READELF=$(find "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)
          for ABI_TRIPLE in aarch64-linux-android x86_64-linux-android; do
            SO="$CARGO_TARGET_DIR/$ABI_TRIPLE/release/lib${CRATE_NAME}.so"
            ALIGN=$("$NDK_LLVM_READELF" -lW "$SO" | awk '/LOAD/ {print $NF; exit}')
            echo "$ABI_TRIPLE LOAD align = $ALIGN"
            [ "$ALIGN" = "0x4000" ] || { echo "FAIL: expected 0x4000 (16384), got $ALIGN"; exit 1; }
          done

      - name: Build host library for UniFFI bindgen
        run: cargo build --release

      - name: Generate UniFFI Kotlin bindings
        run: |
          BINDGEN_OUT="/tmp/trueseal-kotlin-bindings"
          mkdir -p "$BINDGEN_OUT"
          cargo run --release --bin uniffi-bindgen -- generate \
            --library "$CARGO_TARGET_DIR/release/lib${CRATE_NAME}.so" \
            --language kotlin \
            --out-dir "$BINDGEN_OUT"

      - name: Package zip + checksum
        run: |
          VERSION="${{ github.ref_name }}"
          ZIPNAME="trueseal-sync-android-${VERSION}.zip"
          STAGING="/tmp/trueseal-android-staging"

          mkdir -p \
            "$STAGING/jniLibs/arm64-v8a" \
            "$STAGING/jniLibs/x86_64" \
            "$STAGING/kotlin/uniffi/trueseal_sync" \
            "$STAGING/kotlin/uniffi/trueseal_noise"

          cp "$CARGO_TARGET_DIR/aarch64-linux-android/release/lib${CRATE_NAME}.so" \
             "$STAGING/jniLibs/arm64-v8a/"
          cp "$CARGO_TARGET_DIR/x86_64-linux-android/release/lib${CRATE_NAME}.so" \
             "$STAGING/jniLibs/x86_64/"

          cp "/tmp/trueseal-kotlin-bindings/uniffi/trueseal_sync/trueseal_sync.kt" \
             "$STAGING/kotlin/uniffi/trueseal_sync/"
          cp "/tmp/trueseal-kotlin-bindings/uniffi/trueseal_noise/trueseal_noise.kt" \
             "$STAGING/kotlin/uniffi/trueseal_noise/"

          cd /tmp
          zip -r "$ZIPNAME" "trueseal-android-staging"
          shasum -a 256 "$ZIPNAME" > "${ZIPNAME}.sha256"

          echo "ANDROID_ZIP=/tmp/$ZIPNAME" >> "$GITHUB_ENV"
          echo "ANDROID_SHA256=/tmp/${ZIPNAME}.sha256" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ env.ANDROID_ZIP }}
            ${{ env.ANDROID_SHA256 }}
