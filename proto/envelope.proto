syntax = "proto3";

package trueseal.sync.v0;

// Envelope is the wire format for all sync traffic in trueseal-sync.
// It is the only thing the Relay ever sees. The Relay uses recipient_pub
// for routing and sequence for ordering. All other fields are forwarded
// blindly — the Relay never decrypts or interprets them.
//
// Callers embed object identity, type, schema version, and any other
// application-level metadata inside the encrypted payload. The Relay
// has no knowledge of any of it.
message Envelope {
  // Device-scoped monotonic counter. Used by the Relay to order Envelopes
  // within a recipient's Inbox.
  uint64 sequence = 1;

  // Hashes (SHA-256) of parent Envelopes in the Operation Log.
  // Empty for the root Envelope. Exactly one entry in v0.
  // Multiple entries are valid in v1 to express DAG merge points (ADR-0004).
  repeated bytes parents = 2;

  // X25519 public key of the recipient Device. The Relay routes to the
  // Inbox identified by this key. 32 bytes.
  bytes recipient_pub = 3;

  // Ed25519 signature over: sequence || parents || recipient_pub || ciphertext.
  // author_pub is inside the encrypted payload — the relay never sees it (ADR-0018).
  // Signed by the author's Ed25519 private key.
  // Verified by recipients after decryption. 64 bytes.
  bytes signature = 5;

  // Addressed-encrypted payload. Encrypted with crypto::encrypt(recipient_pub, author_pub, plaintext).
  // First 32 bytes of the decrypted plaintext are author_pub (Ed25519 signing key).
  // Opaque to the Relay.
  bytes payload = 6;
}
