syntax = "proto3";

package trueseal.sync.v0;

// Envelope is the wire format for all sync traffic in trueseal-sync.
// It is the only thing the Relay ever sees — and by design it can read
// almost nothing (ADR-0031): the End-to-End Version, so a Device can reject
// a version before decrypting (ADR-0022); the recipient public key, for
// routing; and the sealed payload, the Addressed Encryption output.
//
// Everything else — the author's signing key, the Sequence, the parent
// hashes, the Sender Timestamp, the message and the signature — is sealed
// inside the payload, where the Relay cannot see or test it. Two Envelopes
// from the same Device share no Relay-readable value apart from the version
// (and the recipient key when both go to the same Device).
message Envelope {
  // End-to-End Version (ADR-0022). Plaintext so a Device can reject an
  // unsupported version before decrypting. 0 is reserved and means the
  // refused pre-version format.
  uint32 version = 7;

  // X25519 public key of the recipient Device. The Relay routes to the
  // Inbox identified by this key. 32 bytes.
  bytes recipient_pub = 3;

  // Addressed Encryption output: ephemeral_pub (32) || nonce (12) ||
  // AEAD ciphertext. The sealed plaintext inside carries author_pub,
  // sequence, parent hashes, the Sender Timestamp, the message and the
  // signature (ADR-0031; byte layout in src/envelope.rs, pinned by the
  // SYNC-2 test vectors). Opaque to the Relay.
  bytes payload = 6;
}
